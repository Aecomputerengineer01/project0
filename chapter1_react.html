                <div className="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
                  <h3 className="text-base font-bold text-slate-900 mb-3">
                    ขอบเขตพื้นที่ 18 อำเภอ ในจังหวัดกาฬสินธุ์
                  </h3>
                  <div className="flex flex-wrap gap-2">
                    {currentSection.scopeData.districts.map((d, idx) => (
                      <span key={idx} className="bg-orange-50 text-orange-800 text-xs px-3 py-1.5 rounded-lg border border-orange-200 font-medium">
                        📍 อ.{d}
                      </span>
                    ))}
                  </div>
                </div>
              </div>
            )}

            {/* Section 1.4 */}
            {activeTab === "sec1_4" && (
              <div className="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
                <h3 className="text-base font-bold text-slate-900 mb-4">
                  ผลประโยชน์ที่คาดว่าจะได้รับจำแนกตามมิติ
                </h3>
                <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                  {currentSection.benefits.map((b, idx) => (
                    <div key={idx} className="bg-emerald-50/60 p-5 rounded-xl border border-emerald-200/60">
                      <span className="text-xs font-bold text-emerald-800 bg-emerald-100 px-2.5 py-1 rounded inline-block mb-2">
                        {b.cat}
                      </span>
                      <p className="text-xs text-slate-700 leading-relaxed font-medium">{b.detail}</p>
                    </div>
                  ))}
                </div>
              </div>
            )}

            {/* Section 1.5 */}
            {activeTab === "sec1_5" && (
              <div className="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
                <h3 className="text-base font-bold text-slate-900 mb-4">
                  สถาปัตยกรรมเทคโนโลยีที่ใช้ในการดำเนินงาน (Technology Stack)
                </h3>
                <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                  {currentSection.techStack.map((tech, idx) => (
                    <div key={idx} className="bg-slate-50 p-4 rounded-xl border border-slate-200">
                      <span className="text-[10px] uppercase font-extrabold text-orange-600 tracking-wider">
                        {tech.category}
                      </span>
                      <h4 className="font-bold text-slate-900 text-sm my-1">{tech.name}</h4>
                      <p className="text-xs text-slate-600">{tech.desc}</p>
                    </div>
                  ))}
                </div>
              </div>
            )}

          </main>

          {/* Footer */}
          <footer className="bg-slate-900 text-slate-400 text-xs py-6 border-t border-slate-800">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 text-center">
              <p className="font-semibold text-slate-300">เอกสารบทที่ 1 บทนำ - พัฒนาด้วย ReactJS 18 & Tailwind CSS</p>
              <p className="mt-1 text-slate-500">โครงการพัฒนาเว็บไซต์และแอปพลิเคชันตลาดอสังหาริมทรัพย์ ทรัพย์บังคับคดี และสิ่งปลูกสร้างไม้เก่า จังหวัดกาฬสินธุ์</p>
            </div>
          </footer>
        </div>
      );
    }

    // Render React App
    const rootElement = document.getElementById("root");
    const root = ReactDOM.createRoot(rootElement);
    root.render(<Chapter1App />);
  </script>
</body>
</html>
