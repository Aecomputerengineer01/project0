services:
  # 1. PostgreSQL Database
  db:
    image: postgres:16-alpine
    container_name: kalasin_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: kalasin_realestate
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d kalasin_realestate"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. Node.js + Express.js Backend
  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: kalasin_backend
    restart: always
    environment:
      PORT: 5000
      DATABASE_URL: postgresql://postgres:password123@db:5432/kalasin_realestate?schema=public
    ports:
      - "5000:5000"
    depends_on:
      db:
        condition: service_healthy

  # 3. React + Vite Frontend (Nginx Production Server)
  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: kalasin_frontend
    restart: always
    ports:
      - "80:80"
      - "5173:80"
    depends_on:
      - backend

volumes:
  pgdata:
